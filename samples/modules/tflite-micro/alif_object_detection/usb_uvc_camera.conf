# USB webcam through the alif,uvc-host video driver (usb_uvc_camera.overlay)
CONFIG_USB_HOST_STACK=y
CONFIG_UHC_DWC3=y

# 320x240 YUY2 frames (153600 bytes), plus room for the pool's heap
# overhead and alignment, so that both buffers fit
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=163840
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2

CONFIG_AIPL_CONVERT_YUY2=y
CONFIG_AIPL_CONVERT_YUY2_TO_RGB888=y
# AIPL only compiles the Helium helper behind YUY2 -> RGB888 when the
# BGR888 conversion is enabled too
CONFIG_AIPL_CONVERT_YUY2_TO_BGR888=y
