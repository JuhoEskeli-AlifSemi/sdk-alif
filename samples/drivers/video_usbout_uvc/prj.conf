# Video
CONFIG_VIDEO=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_I2C_TARGET=y
CONFIG_I2C=y
CONFIG_I2C_DW_CLOCK_SPEED=100
CONFIG_SYS_HEAP_AUTO=y

# USB device stack (new stack, required for DWC3). The UVC webcam class is
# implemented locally in this sample (src/uvc.c) on top of the raw device
# stack, so no in-tree class Kconfig is needed.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SAMPLE_USBD_PID=0x0008
CONFIG_SAMPLE_USBD_PRODUCT="Alif Video Capture"
CONFIG_MAIN_STACK_SIZE=2048

# Enlarge the UDC request pool: the bulk IN frame pump streams JPEG frames in
# UVC_TX_CHUNK (2 KB) pieces and needs headroom alongside the control buffers.
CONFIG_UDC_BUF_POOL_SIZE=8192
CONFIG_UDC_BUF_COUNT=16

# Quiet the USB stack — keep warnings/errors but drop the per-transfer INFOs.
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_LOG_LEVEL_ERR=y

# Console line input — only used by VIDEO_USBOUT_INTERACTIVE_CONFIG, but
# CONSOLE_GETLINE is a Kconfig choice symbol so we can't `select` it from
# our sample option; enable it here so the menu is available when the
# user flips VIDEO_USBOUT_INTERACTIVE_CONFIG on.
CONFIG_VIDEO_USBOUT_INTERACTIVE_CONFIG=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETLINE=y
