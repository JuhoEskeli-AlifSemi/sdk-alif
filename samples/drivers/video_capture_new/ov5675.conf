# OV5675 non-ISP buffer pool configuration.
# OV5675 captures 1296x972 Y10P (pitch=2592), needing ~2.5MB per frame.
# Use 2 buffers for double-buffering (avoids CSI pipeline stop/restart).

CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=2523520
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
