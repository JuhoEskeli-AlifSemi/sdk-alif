# Video
CONFIG_VIDEO=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_I2C_TARGET=y
CONFIG_I2C=y
CONFIG_I2C_DW_CLOCK_SPEED=100
CONFIG_SYS_HEAP_AUTO=y

# USB Mass Storage (new USB device stack, required for DWC3)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_MSC_CLASS=y
CONFIG_SAMPLE_USBD_PID=0x0008
CONFIG_SAMPLE_USBD_PRODUCT="Alif Video Capture"
CONFIG_MAIN_STACK_SIZE=2048

# RAM Disk
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_RAM=y

# FAT Filesystem
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# Quiet the USB stack — keep warnings/errors but drop the per-transfer INFOs.
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_USBD_MSC_LOG_LEVEL_ERR=y
