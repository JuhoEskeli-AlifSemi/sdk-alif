# Video
CONFIG_VIDEO=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_I2C_TARGET=y
CONFIG_I2C=y
CONFIG_I2C_DW_CLOCK_SPEED=100
CONFIG_SYS_HEAP_AUTO=y
CONFIG_MAIN_STACK_SIZE=2048

# Scaled-HFRC 38.4 MHz run profile (see app_set_parameters in src/main.c).
# SysTick derives from the CPU clock, so this MUST match the real cycle rate
# or all k_sleep/timeouts are wrong. This is the low-clock setting that starves
# the CPI input FIFO at the sensor's fixed pixel clock; 76800000 works.
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=38400000

# Deferred logging: enlarge the message buffer so the burst of per-ISR CPI logs
# during a capture is not dropped ("--- N messages dropped ---").
CONFIG_LOG_BUFFER_SIZE=32768

# Console line input — Enter triggers a capture, and the framed hex dump is
# printed back over the same console.
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETLINE=y

CONFIG_VIDEO_MEMDUMP_HEX_CONSOLE=n