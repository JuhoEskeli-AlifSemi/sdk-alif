# E8 AppKit (RTSS-HP): OV5675 -> ISP -> JPEG encoder -> MJPEG over UVC.
#
# Applied automatically by board name for every E8 AppKit build (alongside the
# board overlay of the same name). The AppKit supports only the OV5675, so this
# one file holds both the E8 pipeline config (as in the E8 DK board .conf) and
# the OV5675 video buffer pool (as in ov5675.conf) - no EXTRA_CONF_FILE is
# needed. See the README.

# Camera controller extended features (CSI-2 / ISP forwarding path).
CONFIG_VIDEO_ALIF_CAM_EXTENDED=y
CONFIG_MIPI_DSI=y

# Alif ISP (vsi_isp_pico) processing library. Demosaic + scaler are enough to
# turn the sensor's RAW10 Bayer into NV12 (the scaler does the OV5675's
# 1296x972 -> 1024x768 downscale); colour-correction / white-balance modules are
# left off to keep it lean.
CONFIG_USE_ALIF_ISP_LIB=y
CONFIG_ISP_LIB_SCALAR_MODULE=y
CONFIG_ISP_LIB_DMSC_MODULE=y
CONFIG_ISP_LIB_CCM_MODULE=n
CONFIG_ISP_LIB_WBM_MODULE=n
CONFIG_ISP_LIB_WB_MODULE=n

# Hantro VC9000E JPEG hardware encoder + its software helper library.
CONFIG_VIDEO_JPEG_HANTRO_VC9000E=y
CONFIG_USE_ALIF_JPEG_SW_LIB=y

# Video buffer pool for the OV5675 1024x768 pipeline: TWO NV12 1024x768 frames
# (2 x 1,179,648 B, so the ISP keeps capturing while one frame is encoded and
# sent) plus the JPEG output buffer (786,432 B). See ov5675.conf for the full
# sizing; 1,150,000 x 3 = 3.45 MB fits SRAM0 (4 MB).
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=1150000
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=3
