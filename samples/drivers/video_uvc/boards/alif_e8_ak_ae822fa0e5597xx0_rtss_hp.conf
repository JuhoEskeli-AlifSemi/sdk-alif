# E8 AppKit (RTSS-HP): OV5675 -> ISP -> JPEG encoder -> MJPEG over UVC.
#
# Applied automatically by board name for every E8 AppKit build (alongside the
# board overlay of the same name). The AppKit supports only the OV5675, so this
# one file holds both the E8 pipeline config (as in the E8 DK board .conf) and
# the OV5675 video buffer pool (as in ov5675.conf) - no EXTRA_CONF_FILE is
# needed. The RTSS-HE board .conf is a copy of this file; keep the two in sync.
# See the README.

# Camera controller extended features (CSI-2 / ISP forwarding path).
CONFIG_VIDEO_ALIF_CAM_EXTENDED=y
CONFIG_MIPI_DSI=y

# Alif ISP (vsi_isp_pico) processing library. Demosaic + scaler turn the
# sensor's RAW10 Bayer into NV12 (the scaler does the OV5675's 1296x972 ->
# 1024x768 downscale).
CONFIG_USE_ALIF_ISP_LIB=y
CONFIG_ISP_LIB_SCALAR_MODULE=y
CONFIG_ISP_LIB_DMSC_MODULE=y

# Colour correction, from the OV5675 calibration in the ISP library
# (ov5675_isp_param_conf.c; each module's calibration is compiled in only when
# its option is set). Same module set as the MLEK OV5675 ISP pipeline: without
# correction the raw Bayer data comes out green.
# - BLS: subtract the sensor's black level (64 at RAW10).
# - CCM: fixed (manual) colour-correction matrix, which also carries the white
#   balance (its rows boost R and B against G).
# - GAMMAOUT: output gamma curve; the matrix is tuned for gamma-encoded output.
# - EXPOSUREM + AE: auto exposure. The ISP measures the frame brightness and,
#   every few frames, sets the OV5675 exposure and analogue gain (the request
#   goes ISP -> camera -> CSI -> sensor driver).
# The auto white balance (WB + WBM) stays off: its calibration is a generic
# placeholder that pushes the OV5675 image purple.
CONFIG_ISP_LIB_BLS_MODULE=y
CONFIG_ISP_LIB_CCM_MODULE=y
CONFIG_ISP_LIB_GAMMAOUT_MODULE=y
CONFIG_ISP_LIB_EXPOSUREM_MODULE=y
CONFIG_ISP_LIB_AE_MODULE=y
CONFIG_ISP_LIB_WBM_MODULE=n
CONFIG_ISP_LIB_WB_MODULE=n

# Hantro VC9000E JPEG hardware encoder + its software helper library.
CONFIG_VIDEO_JPEG_HANTRO_VC9000E=y
CONFIG_USE_ALIF_JPEG_SW_LIB=y

# Video buffer pool for the OV5675 1024x768 pipeline: TWO NV12 1024x768 frames
# (2 x 1,179,648 B, so the ISP keeps capturing while one frame is encoded and
# sent) plus the JPEG output buffer (786,432 B). See ov5675.conf for the full
# sizing; 1,150,000 x 3 = 3.45 MB fits SRAM0 (4 MB).
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=1150000
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=3
