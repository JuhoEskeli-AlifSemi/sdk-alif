# Extra Kconfig for the E8 DK OV5675 build. Pass with OVERLAY_CONFIG alongside
# the OV5675 DTC overlay (see README). The E8 board .conf (ISP lib + scaler +
# JPEG) is applied automatically by board name and still holds; this file
# enables the ISP colour correction and resizes the video buffer pool for the
# OV5675 pipeline.
#
# Unlike the MT9M114, the OV5675 module is powered by plain power-gpios on the
# sensor node (no fixed regulator) and sits at I2C address 0x10, which does not
# collide with the MW405 display's GT911 touch controller. So this build needs
# neither CONFIG_REGULATOR nor the GT911 reset-hold GPIO hog / CONFIG_GPIO_HOGS.

# Colour correction, from the OV5675 calibration in the ISP library
# (ov5675_isp_param_conf.c; each module's calibration is compiled in only when
# its option is set). These override the E8 board .conf, which leaves them off.
# Same module set as the MLEK OV5675 ISP pipeline: without correction the raw
# Bayer data comes out green.
# - BLS: subtract the sensor's black level (64 at RAW10).
# - CCM: fixed (manual) colour-correction matrix, which also carries the white
#   balance (its rows boost R and B against G).
# - GAMMAOUT: output gamma curve; the matrix is tuned for gamma-encoded output.
# - EXPOSUREM + AE: auto exposure. The ISP measures the frame brightness and,
#   every few frames, sets the OV5675 exposure and analogue gain (the request
#   goes ISP -> camera -> CSI -> sensor driver).
# The auto white balance (WB + WBM) stays off: its calibration is a generic
# placeholder that pushes the OV5675 image purple.
CONFIG_ISP_LIB_BLS_MODULE=y
CONFIG_ISP_LIB_CCM_MODULE=y
CONFIG_ISP_LIB_GAMMAOUT_MODULE=y
CONFIG_ISP_LIB_EXPOSUREM_MODULE=y
CONFIG_ISP_LIB_AE_MODULE=y
CONFIG_ISP_LIB_WBM_MODULE=n
CONFIG_ISP_LIB_WB_MODULE=n

# Video buffer pool for the OV5675 pipeline. The OV5675 streams its full-FOV
# 1296x972 RAW10 mode; the ISP scaler downscales it to 1024x768 NV12 (see the
# overlay). The pool holds TWO NV12 1024x768 frames (2 x 1024*768*1.5 =
# 2,359,296 B - two are needed so the ISP keeps capturing while one frame is
# JPEG-encoded and sent) plus the JPEG output buffer (width*height = 786,432 B).
# That is three allocations totalling ~3.15 MB, so NUM_MAX must be >= 3.
# SZ_MAX x NUM_MAX is the total heap: 1,150,000 x 3 = 3.45 MB holds all three
# with headroom and fits SRAM0 (4 MB).
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=1150000
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=3
