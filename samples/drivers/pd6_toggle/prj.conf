# No console / UART / GPIO: nothing may touch a SYSTOP (PD6) peripheral,
# otherwise accessing it while PD6 is OFF would fault.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_GPIO=n

CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n

# The core just busy-loops and never idles/sleeps, so PM is not needed;
# leaving it off keeps the core in a plain RUN state for a clean baseline.
