# Show the captured video on the DK display (use with display.overlay)
CONFIG_DISPLAY=y
CONFIG_MIPI_DSI=y
CONFIG_GPIO=y

# Room for a frame as large as the 480x800 panel at 16 bits per pixel
CONFIG_SAMPLE_UVC_FRAME_BUFFER_SIZE=768000

# Turn frames with the D/AVE2D GPU through AIPL, converting YUY2 with
# Helium. Set CONFIG_AIPL=n to draw everything with the CPU.
CONFIG_AIPL=y
CONFIG_DAVE2D=y
CONFIG_AIPL_CUSTOM_VIDEO_ALLOC=n
CONFIG_AIPL_COLOR_CORRECTION=n
CONFIG_AIPL_DEMOSAICING=n
CONFIG_AIPL_CONVERT_YUY2_TO_RGB565=y
