CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=16384

CONFIG_USB_HOST_STACK=y
CONFIG_UHC_DWC3=y

# USB host Mass Storage class driver (Bulk-Only Transport + SCSI). It selects
# CONFIG_DISK_ACCESS and registers the medium as disk "USB" (-> "/USB:").
CONFIG_USBH_MSC=y

CONFIG_SHELL=y

# FAT/vfat filesystem on the USB mass storage device
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# Never auto-format the user's USB stick if the mount fails. This option
# defaults to y and is DESTRUCTIVE (it runs mkfs on mount failure); keep it
# off so an unreadable/foreign filesystem is reported instead of erased.
CONFIG_FS_FATFS_MOUNT_MKFS=n

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
