sample:
  name: Alif PM LPCMP Wakeup Demo
  description: >
    Demonstrates waking an Alif RTSS-HE core from PM_STATE_SUSPEND_TO_RAM
    (both the STANDBY and STOP substates) with the low-power comparator
    (LPCMP) as the primary wakeup source and the LPRTC as the
    timeout/backup wakeup source. The off profiles, including
    ALIF_WE_LPCMP in wakeup-events and ALIF_EWIC_VBAT_LP_CMP_IRQ in
    ewic-cfg, come from the pm-system-off-lpcmp-he snippet.
common:
  tags:
    - power
    - pm
    - comparator
    - lpcmp
    - rtc
    - drivers
  filter: SOC_FAMILY_ENSEMBLE or SOC_FAMILY_BALLETTO
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "LPCMP deep-sleep wakeup demo"
      - "Resumed from substate 0: STANDBY"
      - "Resumed from substate 1: STOP"
tests:
  sample.pm.system_off_lpcmp:
    platform_allow:
      - alif_b1_dk_rtss_he
      - alif_e1c_dk_rtss_he
    integration_platforms:
      - alif_b1_dk_rtss_he
    depends_on:
      - counter
