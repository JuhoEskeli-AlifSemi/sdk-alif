CONFIG_VIDEO=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_I2C_TARGET=y
CONFIG_I2C=y
CONFIG_I2C_DW_CLOCK_SPEED=100
CONFIG_SYS_HEAP_AUTO=y

# Power management: STOP-mode S2RAM with LPGPIO button wakeup.
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_POWER_DOMAIN=y
CONFIG_PM_S2RAM=y
CONFIG_PM_SAU_SAVE_RESTORE=y
CONFIG_POWEROFF=y
CONFIG_COUNTER=y
CONFIG_COUNTER_RTC_SNPS_DW=y
CONFIG_IDLE_STACK_SIZE=2048
CONFIG_CORTEX_M_SYSTICK_LPM_TIMER_HOOKS=y
CONFIG_ALIF_SE_DTS_RUN_PROFILE=n
CONFIG_ALIF_SE_DTS_OFF_PROFILE=n
